<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3eb" />
    <meta name="description" content="两室一弹 · 10月5日" />
    <title>两室一弹 · 10月5日</title>
  </head>
  <body>
    <main class="poster" aria-labelledby="main-title">
      <button class="about-button" id="about-button" type="button" aria-label="关于" aria-haspopup="dialog" aria-controls="about-dialog">ⓘ</button>
      <header class="masthead">
        <h1 id="main-title">两室一弹</h1>
        <p class="event-date"><span class="date-dot date-dot-red" aria-hidden="true"></span>10月5日<span class="date-dot date-dot-blue" aria-hidden="true"></span></p>
      </header>

      <section class="countdown" aria-label="游戏倒计时">
        <p class="countdown-label" id="countdown-label">距离正式引爆还有</p>
        <p class="countdown-value" id="countdown-value" aria-live="off">—天 —小时 —分 —秒</p>
      </section>

      <section class="boom-area" aria-label="全球共享按下计数">
        <div class="button-stage" id="button-stage">
          <div class="sticker-layer" id="sticker-layer" aria-hidden="true"></div>
          <button class="boom-button" id="boom-button" type="button" aria-label="按下炸弹，催促群主摇人，全球共享计数加一" disabled>
            <span class="bomb-icon" aria-hidden="true">💣</span>
            <span class="button-title" aria-hidden="true">按下催促群主摇人</span>
          </button>
        </div>
        <p class="counter-number is-loading" id="counter-value" aria-label="正在读取全球计数" aria-live="polite" aria-atomic="true" aria-busy="true">—</p>
        <p class="counter-unit">次期待爆炸</p>
        <p class="visually-hidden" id="connection-note" role="status" aria-live="polite"></p>
      </section>
    </main>
    <dialog class="about-dialog" id="about-dialog" aria-labelledby="about-title">
      <button class="about-close" id="about-close" type="button" aria-label="关闭关于窗口">×</button>
      <h2 id="about-title">关于</h2>
      <p class="about-description">这是为 10 月 5 日《两室一弹》做的小网页。</p>
      <img class="about-qr" src="%BASE_URL%group-qr.png" alt="群聊二维码" />
      <p class="about-qr-caption">扫码加入群聊</p>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
